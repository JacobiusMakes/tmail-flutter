name: Diagnostic PR 4854 full web suite

on:
  push:
    branches:
      - diagnostic/4854-web-fullsuite

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr-head-credentials-prepared-full-suite
            sha: 6d4b3bef260b338a372f6a70f3e2b7ddb73f6101
            apply_harness_patch: true
    name: ${{ matrix.label }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          repository: JacobiusMakes/tmail-flutter
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Pin shared backend digest
        env:
          BACKEND_IMAGE: docker.io/linagora/tmail-backend@sha256:1d163783c6480563dc1c8978a40b6a4a96f872ff2f8423c5a012dbb43fa32bed
        shell: bash
        run: |
          docker pull "$BACKEND_IMAGE"
          docker tag "$BACKEND_IMAGE" linagora/tmail-backend:memory-1.0.18-patch2
          printf 'Source SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Backend digest: %s\n' "$BACKEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply test-harness preparation patch (third arm only)
        if: matrix.apply_harness_patch
        shell: bash
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:diagnostics/4854-harness-order.patch" > "$RUNNER_TEMP/harness-order.patch"
          git apply --unidiff-zero --check "$RUNNER_TEMP/harness-order.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/harness-order.patch"

      - name: Prebuild (same as upstream)
        run: ./scripts/prebuild.sh

      - name: Run focused HomeController unit tests
        run: flutter test test/features/home/presentation/home_controller_test.dart

      - name: Run full upstream web integration suite
        shell: bash
        run: ./scripts/patrol-web-integration-test-with-docker.sh
